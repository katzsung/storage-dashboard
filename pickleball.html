/* ============================== IndexedDB (same DB as the main dashboard, same origin) ============================== */
const DB_NAME = "rallysight_business_map_db_v1";
const DB_VERSION = 4;
let db;
function openDB(){
  return new Promise((resolve,reject)=>{
    const req = indexedDB.open(DB_NAME, DB_VERSION);
    req.onupgradeneeded = e=>{
      const d = e.target.result;
      if(!d.objectStoreNames.contains("files")){
        const fs = d.createObjectStore("files", {keyPath:"id"});
        fs.createIndex("folderId","folderId");
        fs.createIndex("customerId","customerId");
      }
      if(!d.objectStoreNames.contains("activity")) d.createObjectStore("activity", {keyPath:"id"});
      if(!d.objectStoreNames.contains("customers")) d.createObjectStore("customers", {keyPath:"id"});
      if(!d.objectStoreNames.contains("meta")) d.createObjectStore("meta", {keyPath:"key"});
      if(!d.objectStoreNames.contains("pbLeads")) d.createObjectStore("pbLeads", {keyPath:"id"});
      if(!d.objectStoreNames.contains("pbCustom")) d.createObjectStore("pbCustom", {keyPath:"id"});
    };
    req.onblocked = ()=>{
      console.warn("IndexedDB upgrade blocked — another tab has this dashboard open on an older version.");
    };
    req.onsuccess = e=>{
      const conn = e.target.result;
      conn.onversionchange = ()=>{ conn.close(); location.reload(); };
      resolve(conn);
    };
    req.onerror = e=>reject(e.target.error);
  });
}
function tx(store,mode){ return db.transaction(store,mode).objectStore(store); }
function put(store,obj){ return new Promise((res,rej)=>{ const r=tx(store,"readwrite").put(obj); r.onsuccess=()=>res(obj); r.onerror=()=>rej(r.error); }); }
function del(store,id){ return new Promise((res,rej)=>{ const r=tx(store,"readwrite").delete(id); r.onsuccess=()=>res(); r.onerror=()=>rej(r.error); }); }
function getAll(store){ return new Promise((res,rej)=>{ const r=tx(store,"readonly").getAll(); r.onsuccess=()=>res(r.result); r.onerror=()=>rej(r.error); }); }

function esc(s){ return String(s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c])); }
const uid = ()=> (crypto.randomUUID ? crypto.randomUUID() : "id-"+Date.now()+"-"+Math.random().toString(16).slice(2));
function toast(msg){
  const t = document.getElementById("toast");
  t.textContent = msg; t.classList.add("show");
  clearTimeout(toast._t); toast._t = setTimeout(()=>t.classList.remove("show"), 2200);
}

/* ============================== State ============================== */
let pbLeads = {}; // {[courtId]: {id, status, notes, overrides, updatedAt}}
let pbCustomCourts = []; // venues added manually via the "+ Add Court" button
let pbSearch = "";
let pbAreaFilter = "all";
let pbFilterStatus = "all";

function pbStatus(courtId){ const l = pbLeads[courtId]; return (l && l.status) || "none"; }
function pbStatusMeta(key){ return PB_STATUS_OPTIONS.find(o=>o.key===key) || PB_STATUS_OPTIONS[0]; }
async function setPbStatus(courtId, status){
  if(!IS_ADMIN) return;
  const existing = pbLeads[courtId] || {id:courtId, notes:""};
  const rec = {...existing, id:courtId, status, updatedAt:Date.now()};
  await put("pbLeads", rec);
  pbLeads[courtId] = rec;
}
async function setPbNotes(courtId, notes){
  if(!IS_ADMIN) return;
  const existing = pbLeads[courtId] || {id:courtId, status:"none"};
  const rec = {...existing, id:courtId, notes:(notes||"").trim(), updatedAt:Date.now()};
  await put("pbLeads", rec);
  pbLeads[courtId] = rec;
}
function pbAllBaseCourts(){ return [...PICKLEBALL_COURTS, ...pbCustomCourts]; }
function pbAreas(){ return [...new Set(pbAllBaseCourts().map(c=>c.area))]; }
function isCustomPbCourt(courtId){ return pbCustomCourts.some(c=>c.id===courtId); }
function pbCourtData(courtId){
  const base = pbAllBaseCourts().find(c=>c.id===courtId);
  if(!base) return null;
  const lead = pbLeads[courtId];
  return (lead && lead.overrides) ? {...base, ...lead.overrides} : base;
}
async function setPbOverrides(courtId, overrides){
  if(!IS_ADMIN) return;
  const existing = pbLeads[courtId] || {id:courtId, status:"none", notes:""};
  const rec = {...existing, id:courtId, overrides:{...(existing.overrides||{}), ...overrides}, updatedAt:Date.now()};
  await put("pbLeads", rec);
  pbLeads[courtId] = rec;
}
async function addPbCourt(fields){
  if(!IS_ADMIN) return null;
  const rec = {
    id: "pbc-"+uid(),
    area: (fields.area||"").trim() || "Other",
    name: (fields.name||"").trim(),
    type: (fields.type||"").trim(),
    courts: (fields.courts||"").trim(),
    location: (fields.location||"").trim(),
    barangay: (fields.barangay||"").trim(),
    rates: (fields.rates||"").trim(),
    contact: (fields.contact||"").trim(),
    contactUrl: (fields.contactUrl||"").trim(),
    booking: (fields.booking||"").trim(),
    bookingUrl: (fields.bookingUrl||"").trim(),
    createdAt: Date.now()
  };
  await put("pbCustom", rec);
  pbCustomCourts.push(rec);
  return rec;
}
async function deletePbCourt(courtId){
  if(!IS_ADMIN) return;
  await del("pbCustom", courtId);
  pbCustomCourts = pbCustomCourts.filter(c=>c.id!==courtId);
  if(pbLeads[courtId]){ await del("pbLeads", courtId); delete pbLeads[courtId]; }
}

/* ============================== Rendering ============================== */
function pbTypeColor(type){
  const t = (type||"").toLowerCase();
  if(t==="indoor") return COLORS.blue;
  if(t==="covered") return COLORS.purple;
  return COLORS.green; // outdoor / default
}

function renderPbCard(c){
  const st = pbStatus(c.id);
  const meta = pbStatusMeta(st);
  const tc = pbTypeColor(c.type);
  const isCustom = isCustomPbCourt(c.id);
  const contactHtml = c.contactUrl
    ? `<a href="${esc(c.contactUrl)}" target="_blank" rel="noopener">${esc(c.contact||"Contact")}</a>`
    : `<span>${esc(c.contact||"—")}</span>`;
  const bookingHtml = c.booking
    ? (c.bookingUrl
        ? `<div class="pb-card-row"><span class="pb-card-ico">🔗</span><a href="${esc(c.bookingUrl)}" target="_blank" rel="noopener">${esc(c.booking)}</a></div>`
        : `<div class="pb-card-row"><span class="pb-card-ico">🔗</span><span>${esc(c.booking)}</span></div>`)
    : "";
  const mapsQuery = [c.location, c.barangay, c.area, "Cebu"].filter(Boolean).join(", ");
  const mapsUrl = "https://www.google.com/maps/search/?api=1&query=" + encodeURIComponent(mapsQuery);
  const locationHtml = c.location
    ? `<a href="${esc(mapsUrl)}" target="_blank" rel="noopener">${esc(c.location)}</a>`
    : `<span>—</span>`;
  return `<div class="pb-card">
    <div class="pb-card-head">
      <div class="flex1">
        <div class="pb-card-name">${esc(c.name)}</div>
        <div class="pb-card-area">${esc(c.area)}${c.barangay?" · Brgy. "+esc(c.barangay):""}</div>
      </div>
      <span class="pb-type-tag" style="background:${tc.bg};color:${tc.c}">${esc(c.type||"—")}</span>
      <button class="mini-btn admin-only" data-editpb="${c.id}" title="Edit venue">✎</button>
      ${isCustom?`<button class="mini-btn admin-only" data-delpb="${c.id}" title="Delete venue">🗑</button>`:""}
    </div>
    <div class="pb-card-body">
      <div class="pb-card-row"><span class="pb-card-ico">📍</span>${locationHtml}</div>
      <div class="pb-card-row"><span class="pb-card-ico">🏟</span><span>${esc(c.courts||"—")} court(s)</span></div>
      <div class="pb-card-row"><span class="pb-card-ico">💵</span><span>${esc(c.rates||"—")}</span></div>
      <div class="pb-card-row"><span class="pb-card-ico">📱</span>${contactHtml}</div>
      ${bookingHtml}
    </div>
    <div class="pb-card-notes">
      <div class="pb-card-notes-label">Notes</div>
      <textarea class="pb-notes-textarea admin-editable" data-pbnotes="${c.id}" placeholder="Add internal notes about this venue..." ${IS_ADMIN?"":"readonly"}>${esc((pbLeads[c.id]&&pbLeads[c.id].notes)||"")}</textarea>
    </div>
    <div class="pb-card-foot admin-only">
      <select class="pb-status-select admin-editable" data-pbstatus="${c.id}" style="border-color:${meta.color};color:${meta.color};background:${meta.bg}" ${IS_ADMIN?"":"disabled"}>
        ${PB_STATUS_OPTIONS.map(o=>`<option value="${o.key}" ${o.key===st?"selected":""}>${esc(o.label)}</option>`).join("")}
      </select>
    </div>
  </div>`;
}

function refreshPbBody(){
  if(document.getElementById("pbBody")) renderPbBody();
}

function renderPbBody(){
  const container = document.getElementById("pbBody");
  if(!container) return;
  const q = pbSearch.toLowerCase();

  const allBase = pbAllBaseCourts();
  const areas = pbAreas();
  const list = allBase.map(base=>pbCourtData(base.id)).filter(c=>{
    if(pbAreaFilter!=="all" && c.area!==pbAreaFilter) return false;
    if(pbFilterStatus!=="all" && pbStatus(c.id)!==pbFilterStatus) return false;
    if(q && !(`${c.name} ${c.location} ${c.barangay} ${c.area} ${(pbLeads[c.id]&&pbLeads[c.id].notes)||""}`.toLowerCase().includes(q))) return false;
    return true;
  }).sort((a,b)=>a.name.localeCompare(b.name, undefined, {sensitivity:"base"}));

  const totalVenues = allBase.length;
  const contactedCount = allBase.filter(c=>pbStatus(c.id)!=="none").length;
  const clientCount = allBase.filter(c=>pbStatus(c.id)==="client").length;
  const interestedCount = allBase.filter(c=>pbStatus(c.id)==="interested").length;

  container.innerHTML = `
    <div class="stat-strip admin-only" style="margin-bottom:22px;">
      <div class="stat-card"><div class="stat-num">${totalVenues}</div><div class="stat-label">Total Venues</div></div>
      <div class="stat-card"><div class="stat-num">${areas.length}</div><div class="stat-label">Areas Covered</div></div>
      <div class="stat-card"><div class="stat-num">${contactedCount}</div><div class="stat-label">Outreach Started</div></div>
      <div class="stat-card"><div class="stat-num">${clientCount}</div><div class="stat-label">Clients</div></div>
    </div>
    <div class="stat-strip viewer-only" style="margin-bottom:22px;grid-template-columns:repeat(2,1fr);">
      <div class="stat-card"><div class="stat-num">${totalVenues}</div><div class="stat-label">Total Venues</div></div>
      <div class="stat-card"><div class="stat-num">${areas.length}</div><div class="stat-label">Areas Covered</div></div>
    </div>
    <div class="dash-toolbar">
      <div class="search-box">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.3-4.3"/></svg>
        <input type="text" id="pbSearchInput" placeholder="Search venue, barangay, or area..." value="${esc(pbSearch)}">
      </div>
      <button class="btn btn-primary admin-only" id="pbAddCourtBtn">+ Add Court</button>
    </div>
    <div class="pb-chip-group" id="pbAreaChips">
      <button class="pb-chip ${pbAreaFilter==='all'?'active':''}" data-area="all">All Areas (${totalVenues})</button>
      ${areas.map(a=>{
        const n = allBase.filter(c=>c.area===a).length;
        return `<button class="pb-chip ${pbAreaFilter===a?'active':''}" data-area="${esc(a)}">${esc(a)} (${n})</button>`;
      }).join("")}
    </div>
    <div class="pb-chip-group admin-only" id="pbStatusChips" style="margin-bottom:18px;">
      <button class="pb-chip ${pbFilterStatus==='all'?'active':''}" data-status="all">All Statuses</button>
      ${PB_STATUS_OPTIONS.map(o=>`<button class="pb-chip ${pbFilterStatus===o.key?'active':''}" data-status="${o.key}" style="${pbFilterStatus===o.key?`background:${o.bg};color:${o.color};border-color:${o.color};`:""}">${esc(o.label)}</button>`).join("")}
    </div>
    <div class="pb-summary admin-only">${list.length} of ${totalVenues} venue${totalVenues===1?"":"s"} shown${interestedCount?` · ${interestedCount} marked Interested`:""}</div>
    <div class="pb-summary viewer-only">${list.length} of ${totalVenues} venue${totalVenues===1?"":"s"} shown</div>
    <div class="pb-list">
      ${list.length ? list.map(c=>renderPbCard(c)).join("") : `<div class="dash-empty">No venues match your filters.</div>`}
    </div>
  `;

  const searchEl = document.getElementById("pbSearchInput");
  searchEl.addEventListener("input", e=>{ pbSearch = e.target.value; renderPbBody(); });
  if(pbSearch){ searchEl.focus(); searchEl.setSelectionRange(pbSearch.length, pbSearch.length); }

  document.getElementById("pbAddCourtBtn").addEventListener("click", ()=>{ openAddPbModal(refreshPbBody); });

  container.querySelectorAll("[data-area]").forEach(btn=>btn.addEventListener("click", ()=>{ pbAreaFilter = btn.dataset.area; renderPbBody(); }));
  container.querySelectorAll("[data-status]").forEach(btn=>btn.addEventListener("click", ()=>{ pbFilterStatus = btn.dataset.status; renderPbBody(); }));
  container.querySelectorAll("[data-pbstatus]").forEach(sel=>sel.addEventListener("change", async e=>{
    const courtId = sel.dataset.pbstatus;
    const court = pbCourtData(courtId);
    await setPbStatus(courtId, e.target.value);
    const meta = pbStatusMeta(e.target.value);
    sel.style.borderColor = meta.color; sel.style.color = meta.color; sel.style.background = meta.bg;
    toast(court ? `${court.name} marked "${meta.label}"` : "Status updated");
  }));
  container.querySelectorAll("[data-editpb]").forEach(btn=>btn.addEventListener("click", ()=>{
    openEditPbModal(btn.dataset.editpb, refreshPbBody);
  }));
  container.querySelectorAll("[data-delpb]").forEach(btn=>btn.addEventListener("click", async ()=>{
    const court = pbCourtData(btn.dataset.delpb);
    if(!confirm(`Delete "${court?court.name:"this venue"}"? This can't be undone.`)) return;
    await deletePbCourt(btn.dataset.delpb);
    toast("Venue deleted");
    renderPbBody();
  }));
  container.querySelectorAll("[data-pbnotes]").forEach(ta=>{
    let debounceTimer;
    const save = ()=>{ clearTimeout(debounceTimer); setPbNotes(ta.dataset.pbnotes, ta.value); };
    ta.addEventListener("input", ()=>{ clearTimeout(debounceTimer); debounceTimer = setTimeout(save, 600); });
    ta.addEventListener("blur", save);
  });
}

  const overlay = document.getElementById("modalOverlay");

  box.dataset.mode = "edit-pb";
  box.style.width = "460px";
  box.innerHTML = `

    <div class="cust-form" style="margin-top:0;padding-top:0;border-top:none;">

      area: document.getElementById("editPbArea").value.trim() || c.area,
      name,
      type: document.getElementById("editPbType").value.trim(),
      courts: document.getElementById("editPbCourts").value.trim(),
      location: document.getElementById("editPbLocation").value.trim(),
      barangay: document.getElementById("editPbBarangay").value.trim(),
      rates: document.getElementById("editPbRates").value.trim(),
      contact: document.getElementById("editPbContact").value.trim(),

      booking: document.getElementById("editPbBooking").value.trim(),
      bookingUrl: document.getElementById("editPbBookingUrl").value.trim()
    });
    toast("Venue updated");
    closeModal();
    if(onSaved) onSaved();
  };
  document.getElementById("editPbSave").onclick = save;
  box.querySelectorAll("input").forEach(inp=>inp.addEventListener("keydown", e=>{ if(e.key==="Enter") save(); }));
}

    if(!area){ (usingNew?areaNewEl:areaSelectEl).focus(); return; }

      area, name,

/* ============================== Auth (Google Sign-In) ============================== */
/* This page is publicly viewable. Signing in with an allowed Google account unlocks
   editing (same as the main RallySight dashboard, and stored in the same IndexedDB —
   changes made here show up there too). This is a UI-level lock, not a security boundary. */
let IS_ADMIN = false;
const GOOGLE_CLIENT_ID = "593344772657-ni4h4dregeoncvng1c6u2qsjtg8ri6i0.apps.googleusercontent.com";
const ALLOWED_EMAILS = ["katrina.sungahid@gmail.com"];
const AUTH_KEY = "rallysight_auth_session_v1";
const AUTH_TTL_MS = 30*24*60*60*1000; // 30 days

function getStoredSession(){
  try{
    const raw = localStorage.getItem(AUTH_KEY);
    if(!raw) return null;
    const s = JSON.parse(raw);
    if(!s || !s.email || !s.ts) return null;
    if(Date.now() - s.ts > AUTH_TTL_MS) return null;
    if(!ALLOWED_EMAILS.includes(s.email)) return null;
    return s;
  }catch(e){ return null; }
}
function storeSession(email, name, picture){
  localStorage.setItem(AUTH_KEY, JSON.stringify({email, name:name||"", picture:picture||"", ts: Date.now()}));
}
function clearSession(){ localStorage.removeItem(AUTH_KEY); }

function showLoginError(msg){
  const el = document.getElementById("loginError");
  if(!el) return;
  el.textContent = msg;
  el.style.display = "block";
}
function hideLoginError(){
  const el = document.getElementById("loginError");
  if(el) el.style.display = "none";
}

async function handleCredentialResponse(response){
  hideLoginError();
  try{
    const r = await fetch("https://oauth2.googleapis.com/tokeninfo?id_token=" + encodeURIComponent(response.credential));
    if(!r.ok) throw new Error("verify failed");
    const payload = await r.json();
    if(payload.aud !== GOOGLE_CLIENT_ID){
      showLoginError("Sign-in verification failed. Please try again.");
      return;
    }
    if(payload.email_verified !== "true" && payload.email_verified !== true){
      showLoginError("Your Google email isn't verified.");
      return;
    }
    if(!ALLOWED_EMAILS.includes(payload.email)){
      showLoginError(esc(payload.email) + " isn't authorized to edit this dashboard.");
      if(window.google && google.accounts && google.accounts.id) google.accounts.id.disableAutoSelect();
      return;
    }
    storeSession(payload.email, payload.name, payload.picture);
    location.reload();
  }catch(e){
    showLoginError("Couldn't verify your Google account. Check your connection and try again.");
  }
}

function openLoginScreen(){
  const el = document.getElementById("loginScreen");
  if(el) el.classList.add("show");
  hideLoginError();
  renderGoogleButton();
}
function closeLoginScreen(){
  const el = document.getElementById("loginScreen");
  if(el) el.classList.remove("show");
}

function enterApp(admin){
  IS_ADMIN = !!admin;
  document.body.classList.toggle("is-admin", IS_ADMIN);
  initPage();
}

function signOut(){
  clearSession();
  if(window.google && google.accounts && google.accounts.id){
    google.accounts.id.disableAutoSelect();
  }
  location.reload();
}

function renderGoogleButton(){
  const container = document.getElementById("googleBtnContainer");
  if(!container) return;
  if(!(window.google && google.accounts && google.accounts.id)){
    setTimeout(renderGoogleButton, 300);
    return;
  }
  container.innerHTML = "";
  google.accounts.id.initialize({
    client_id: GOOGLE_CLIENT_ID,
    callback: handleCredentialResponse
  });
  google.accounts.id.renderButton(container, {theme:"outline", size:"large", width:280, text:"signin_with", shape:"pill"});
}

function boot(){
  const session = getStoredSession();
  enterApp(!!session);
}

document.addEventListener("DOMContentLoaded", ()=>{
  const signOutBtn = document.getElementById("signOutBtn");
  if(signOutBtn) signOutBtn.addEventListener("click", signOut);
  const signInBtn = document.getElementById("signInBtn");
  if(signInBtn) signInBtn.addEventListener("click", openLoginScreen);
  const loginCloseBtn = document.getElementById("loginCloseBtn");
  if(loginCloseBtn) loginCloseBtn.addEventListener("click", closeLoginScreen);
  boot();
});
})();
</script>
